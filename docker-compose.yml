services:
  app:
    build: .
    container_name: ecoride_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - mongo
    environment:
      DB_HOST: mysql
      DB_NAME: ecoride
      DB_USER: ecoride
      DB_PASS: ecoride_pass
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ecoride_nosql

  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    environment:
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride
      MYSQL_PASSWORD: ecoride_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    container_name: ecoride_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
